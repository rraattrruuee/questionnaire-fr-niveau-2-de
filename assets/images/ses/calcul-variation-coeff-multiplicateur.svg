<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" width="100%" height="100%">
  <defs>
    <linearGradient id="calcBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="760" height="420" rx="16" fill="url(#calcBg)" stroke="#334155" stroke-width="2" />

  <!-- Titre -->
  <text x="380" y="34" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="bold">
    Fiche Méthode : Coefficient Multiplicateur &amp; Taux de Variation
  </text>
  <text x="380" y="54" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    Mesurer rigoureusement les hausses, les baisses et les évolutions successives
  </text>

  <!-- Panneau 1 : Coefficient Multiplicateur (CM) -->
  <g transform="translate(35, 75)">
    <rect width="335" height="155" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.3" />
    <text x="167" y="24" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">
      1. Le Coefficient Multiplicateur (CM)
    </text>
    
    <!-- Formule -->
    <rect x="20" y="38" width="295" height="42" rx="6" fill="#0f172a" />
    <text x="167" y="64" text-anchor="middle" fill="#facc15" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">
      CM = Valeur d'arrivée (Va) / Valeur de départ (Vd)
    </text>

    <!-- Exemples -->
    <text x="25" y="102" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">
      • Hausse de 20 € à 24 € : <tspan fill="#4ade80" font-weight="bold">24 / 20 = 1,2</tspan> (CM &gt; 1)
    </text>
    <text x="25" y="122" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">
      • Baisse de 100 € à 80 € : <tspan fill="#f87171" font-weight="bold">80 / 100 = 0,8</tspan> (CM &lt; 1)
    </text>
    <text x="25" y="140" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">
      ⚠️ Un CM n'est JAMAIS négatif (une baisse correspond à CM &lt; 1).
    </text>
  </g>

  <!-- Panneau 2 : Taux de Variation (%) -->
  <g transform="translate(390, 75)">
    <rect width="335" height="155" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.3" />
    <text x="167" y="24" text-anchor="middle" fill="#4ade80" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">
      2. Le Taux de Variation en %
    </text>
    
    <!-- Formule -->
    <rect x="20" y="38" width="295" height="42" rx="6" fill="#0f172a" />
    <text x="167" y="64" text-anchor="middle" fill="#facc15" font-family="system-ui, sans-serif" font-size="15" font-weight="bold">
      Var = CM - 1 = (Va - Vd) / Vd
    </text>

    <!-- Exemples -->
    <text x="25" y="102" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">
      • Si CM = 1,2 : Var = 1,2 - 1 = +0,2 ➔ <tspan fill="#4ade80" font-weight="bold">+20 %</tspan>
    </text>
    <text x="25" y="122" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">
      • Si CM = 0,8 : Var = 0,8 - 1 = -0,2 ➔ <tspan fill="#f87171" font-weight="bold">-20 %</tspan>
    </text>
    <text x="25" y="140" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">
      Un taux négatif indique directement une diminution.
    </text>
  </g>

  <!-- Panneau 3 : La règle absolue des variations successives -->
  <g transform="translate(35, 245)">
    <rect width="690" height="95" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" />
    <text x="345" y="26" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">
      🚨 Règle d'or : On ne peut JAMAIS additionner des pourcentages de variation !
    </text>

    <!-- Démonstration -->
    <g transform="translate(25, 42)">
      <rect width="640" height="42" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
      <text x="320" y="18" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11">
        Trois hausses successives : +30 %, +15 %, +20 %
      </text>
      <text x="320" y="34" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">
        ❌ Faux : 30 + 15 + 20 = 65 % | <tspan fill="#4ade80">✅ Vrai : 1,30 × 1,15 × 1,20 = 1,794 ➔ +79,4 %</tspan>
      </text>
    </g>
  </g>

  <!-- Bandeau bas : Pourcentages de répartition -->
  <g transform="translate(35, 350)">
    <rect width="690" height="52" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1" />
    <text x="345" y="22" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">
      Distinction cruciale : Pourcentages de répartition vs de variation
    </text>
    <text x="345" y="39" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10">
      On PEUT additionner des pourcentages de répartition sur une même population (ex: 7 % de petites forêts + 32 % de moyennes = 39 % de forêts).
    </text>
  </g>
</svg>