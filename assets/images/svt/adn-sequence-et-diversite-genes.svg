<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="100%" height="100%">
  <defs>
    <linearGradient id="seqBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
  </defs>

  <rect width="760" height="390" rx="16" fill="url(#seqBg)" stroke="#334155" stroke-width="2" />

  <!-- Titre -->
  <text x="380" y="34" text-anchor="middle" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="bold">
    L'ordre des nucléotides : Le message codé des gènes
  </text>
  <text x="380" y="54" text-anchor="middle" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="12">
    Deux gènes différents se distinguent par leur longueur et leur séquence de nucléotides
  </text>

  <!-- Du chromosome à la double hélice -->
  <g transform="translate(40, 75)">
    <rect width="210" height="235" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
    <text x="105" y="24" text-anchor="middle" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">Du chromosome au gène</text>
    
    <!-- Chromosome stylisé -->
    <g transform="translate(105, 75)">
      <!-- Chromatide 1 -->
      <path d="M -10,-35 C -25,-15 -25,15 -10,35 C 0,40 5,30 0,0 C 5,-30 0,-40 -10,-35 Z" fill="#a855f7" />
      <!-- Chromatide 2 -->
      <path d="M 10,-35 C 25,-15 25,15 10,35 C 0,40 -5,30 0,0 C -5,-30 0,-40 10,-35 Z" fill="#c084fc" />
      <circle cx="0" cy="0" r="5" fill="#f8fafc" />
      <text x="0" y="55" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10">Chromosome condensé</text>
    </g>

    <!-- Fil d'ADN déroulé -->
    <path d="M 125,75 Q 165,110 185,155 Q 195,185 205,190" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="3,3" />
    <text x="105" y="195" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Molécule d'ADN déroulée</text>
    <text x="105" y="212" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Comporte des centaines de gènes</text>
  </g>

  <!-- Comparaison Gène 1 vs Gène 2 -->
  <g transform="translate(270, 75)">
    <!-- Gène 1 -->
    <rect width="450" height="110" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.3" />
    <text x="25" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Gène 1 (ex. gène de la mucoviscidose ou de l'insuline)</text>
    
    <!-- Séquence nucléotides Gène 1 -->
    <g transform="translate(25, 42)">
      <!-- Blocs de nucléotides : A C G T A T G C -->
      <g transform="translate(0,0)"><rect width="45" height="26" rx="4" fill="#ef4444"/><text x="22" y="18" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">A</text></g>
      <g transform="translate(50,0)"><rect width="45" height="26" rx="4" fill="#10b981"/><text x="22" y="18" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">C</text></g>
      <g transform="translate(100,0)"><rect width="45" height="26" rx="4" fill="#f59e0b"/><text x="22" y="18" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">G</text></g>
      <g transform="translate(150,0)"><rect width="45" height="26" rx="4" fill="#3b82f6"/><text x="22" y="18" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">T</text></g>
      <g transform="translate(200,0)"><rect width="45" height="26" rx="4" fill="#ef4444"/><text x="22" y="18" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">A</text></g>
      <g transform="translate(250,0)"><rect width="45" height="26" rx="4" fill="#3b82f6"/><text x="22" y="18" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">T</text></g>
      <g transform="translate(300,0)"><rect width="45" height="26" rx="4" fill="#f59e0b"/><text x="22" y="18" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">G</text></g>
      <g transform="translate(350,0)"><rect width="45" height="26" rx="4" fill="#10b981"/><text x="22" y="18" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">C</text></g>
    </g>
    <text x="25" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Séquence 1 : A - C - G - T - A - T - G - C... → Code pour une fonction biologique A</text>

    <!-- Gène 2 -->
    <g transform="translate(0, 125)">
      <rect width="450" height="110" rx="12" fill="#1e293b" stroke="#f472b6" stroke-width="1.3" />
      <text x="25" y="26" fill="#f472b6" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Gène 2 (autre gène, ex. groupe sanguin ou mélanine)</text>
      
      <!-- Séquence nucléotides Gène 2 (ordre différent) -->
      <g transform="translate(25, 42)">
        <g transform="translate(0,0)"><rect width="45" height="26" rx="4" fill="#10b981"/><text x="22" y="18" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">C</text></g>
        <g transform="translate(50,0)"><rect width="45" height="26" rx="4" fill="#f59e0b"/><text x="22" y="18" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">G</text></g>
        <g transform="translate(100,0)"><rect width="45" height="26" rx="4" fill="#3b82f6"/><text x="22" y="18" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">T</text></g>
        <g transform="translate(150,0)"><rect width="45" height="26" rx="4" fill="#ef4444"/><text x="22" y="18" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">A</text></g>
        <g transform="translate(200,0)"><rect width="45" height="26" rx="4" fill="#10b981"/><text x="22" y="18" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">C</text></g>
        <g transform="translate(250,0)"><rect width="45" height="26" rx="4" fill="#ef4444"/><text x="22" y="18" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">A</text></g>
        <g transform="translate(300,0)"><rect width="45" height="26" rx="4" fill="#3b82f6"/><text x="22" y="18" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">T</text></g>
        <g transform="translate(350,0)"><rect width="45" height="26" rx="4" fill="#f59e0b"/><text x="22" y="18" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="12" font-weight="bold">G</text></g>
      </g>
      <text x="25" y="96" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Séquence 2 : C - G - T - A - C - A - T - G... → Code pour une fonction biologique B</text>
    </g>
  </g>

  <!-- Bandeau résumé bas -->
  <g transform="translate(40, 325)">
    <rect width="680" height="50" rx="10" fill="#0f172a" stroke="#64748b" stroke-width="1.2" />
    <text x="340" y="22" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="bold">
      Capacité de codage illimitée
    </text>
    <text x="340" y="40" text-anchor="middle" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11">
      Ce n'est pas la nature chimique des nucléotides qui change, mais leur <tspan fill="#facc15" font-weight="bold">ordre d'enchaînement linéaire</tspan>.
    </text>
  </g>
</svg>