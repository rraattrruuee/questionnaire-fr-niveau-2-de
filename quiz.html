<!doctype html>
<html lang="fr" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="theme-color" content="#0b1020" />
        <link rel="icon" href="quiz_icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="quiz_icon.png" />
        <link rel="manifest" href="manifest.json" />
        <title>Questionnaire</title>
        <script>
            (function () {
                try {
                    var t = localStorage.getItem("theme-preference");
                    if (t !== "light" && t !== "dark") {
                        t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                    }
                    document.documentElement.setAttribute("data-theme", t);
                    document.documentElement.style.colorScheme = t;
                } catch (e) {}
            })();
        </script>
        <link rel="stylesheet" href="css/theme.css" />
        <link rel="stylesheet" href="css/quiz.css" />
    </head>
    <body>
        <header class="topbar">
            <div class="topbar-inner">
                <a class="brand" href="index.html">
                    <img src="quiz_icon.svg" alt="" width="30" height="30" />
                    <span>Questionnaires <span class="brand-sub">2nde</span></span>
                </a>
                <button class="theme-toggle" type="button" data-theme-toggle>
                    <span class="theme-toggle-icon" aria-hidden="true">☀️</span>
                    <span class="theme-toggle-label">Thème clair</span>
                </button>
            </div>
        </header>

        <div class="quiz-container anim-border-fade">
            <div class="quiz-nav-bar">
                <button id="back-btn" class="btn btn-ghost" type="button">← Retour</button>
            </div>

            <!-- 1) Category selector (uniquement si le quiz a plusieurs categories) -->
            <div id="category-area" class="hidden">
                <header class="header">
                    <h1 id="category-title">Choisir une catégorie</h1>
                </header>
                <div id="category-list" class="selector-list"></div>
            </div>

            <!-- 3) Quiz -->
            <div id="quiz-area" class="hidden">
                <header class="header">
                    <h1 id="quiz-title">Quiz</h1>
                    <p>
                        <span id="cat-label" class="cat-label"></span>
                        <span id="counter-label">Question 1 / 0</span>
                    </p>
                </header>

                <div class="progress-bar-container">
                    <div id="progress-fill" class="progress-bar-fill"></div>
                </div>

                <div id="question-block" class="question-block">
                    <div id="current-question-card" class="question-card"></div>
                    <div id="feedback-area" class="hidden"></div>
                </div>

                <div class="main-btn-container">
                    <button id="main-btn">Valider la Réponse</button>
                </div>
            </div>

            <!-- 4) Results -->
            <div id="results" class="hidden">
                <h2>Quiz Terminé !</h2>
                <p id="score-display"></p>
                <p id="feedback-message"></p>
                <div class="results-actions">
                    <button id="restart-btn">Recommencer</button>
                    <button id="back-btn-results" class="btn btn-ghost" type="button">Retour au portail</button>
                </div>
            </div>
        </div>

        <script src="js/theme.js"></script>
        <script src="js/quiz.js"></script>
    </body>
</html>
