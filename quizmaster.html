<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b1020" />
  <link rel="icon" href="quiz_icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="quiz_icon.png" />
  <link rel="manifest" href="manifest.json" />
  <title>QuizMaster Dynamique - Générateur & Importateur</title>
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme-preference");
        if (t !== "light" && t !== "dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.setAttribute("data-theme", t);
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/quiz.css" />
  <style>
    .qm-container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 2rem;
      background: var(--quiz-card-bg);
      border: 1px solid var(--quiz-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      overflow: hidden;
      word-wrap: break-word;
    }
    .qm-container h1 {
      text-align: center;
      margin: 0 0 1.5rem;
      line-height: 1.2;
      color: var(--quiz-text);
      font-size: 1.5rem;
    }
    .prompt-container {
      background: var(--quiz-card-inner);
      border: 2px dashed var(--quiz-main-btn);
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 20px;
    }
    .prompt-label { margin: 0 0 10px; font-weight: 700; color: var(--quiz-btn-text); font-size: 0.9rem; }
    .prompt-box {
      display: block;
      width: 100%;
      box-sizing: border-box;
      min-height: 170px;
      max-height: 340px;
      resize: vertical;
      background: var(--quiz-card-bg);
      border: 1px solid var(--quiz-border);
      padding: 10px;
      border-radius: 8px;
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
      line-height: 1.45;
      color: var(--quiz-text);
      margin-bottom: 10px;
    }
    .btn-prompt-copy {
      width: 100%;
      background: var(--quiz-main-btn);
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: filter 0.3s ease, transform 0.3s ease;
    }
    .btn-prompt-copy:hover { filter: brightness(0.9); transform: translateY(-1px); }
    .btn-prompt-copy.success { background: var(--quiz-correct) !important; }
    .import-zone { display: flex; flex-direction: column; gap: 15px; margin-top: 10px; }
    .file-upload-wrapper { position: relative; overflow: hidden; display: block; width: 100%; }
    .btn-file-custom {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      background: var(--quiz-card-bg); color: var(--quiz-btn-text);
      border: 2px solid var(--quiz-btn-border); padding: 10px 15px;
      border-radius: 8px; font-weight: 700; cursor: pointer;
      transition: all 0.3s ease; width: 100%; text-align: center;
    }
    .btn-file-custom:hover { background: var(--quiz-btn-text); color: #fff; }
    .file-upload-wrapper input[type="file"] {
      font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer;
    }
    #json-paste {
      width: 100%; padding: 10px; border-radius: 8px;
      border: 2px solid var(--quiz-border); background: var(--quiz-card-bg);
      font: inherit; color: var(--quiz-text); transition: border-color 0.3s;
    }
    #json-paste:focus { border-color: var(--quiz-main-btn); outline: none; }
    .btn-load {
      cursor: pointer; background: var(--quiz-correct); color: #fff; border: none;
      padding: 10px 15px; border-radius: 8px; font: inherit; font-weight: 700;
      width: 100%; transition: filter 0.3s ease;
    }
    .btn-load:hover { filter: brightness(0.9); }
    .export-button { background: var(--quiz-btn-text); color: #fff; }
    .export-overlay {
      position: fixed; inset: 0; background: var(--scrim);
      display: flex; align-items: center; justify-content: center; padding: 1rem; z-index: 50;
    }
    .export-modal {
      width: min(520px, 100%); background: var(--quiz-card-bg);
      border: 1px solid var(--quiz-border); border-radius: 20px; padding: 1.5rem;
      box-shadow: var(--shadow);
    }
    .export-modal h2 { margin: 0 0 1rem; color: var(--quiz-text); font-size: 1.25rem; }
    .export-modal label { display: block; margin-bottom: 0.5rem; font-weight: 700; color: var(--quiz-btn-text); }
    .export-modal input {
      width: 100%; padding: 0.85rem 1rem; border-radius: 10px;
      border: 1px solid var(--quiz-border); margin-bottom: 1rem;
      font-size: 1rem; color: var(--quiz-text); background: var(--quiz-card-inner);
    }
    .modal-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
    .qm-grid { display: grid; gap: 15px; }
    @media (min-width: 768px) { .qm-grid { grid-template-columns: 1fr 1fr; } }
    .preview-label {
      display: block; margin: 1.5rem 0 0.5rem; font-weight: 700;
      color: var(--quiz-btn-text); font-size: 0.9rem;
    }
    .preview-placeholder {
      padding: 2rem 1rem; text-align: center; color: var(--quiz-text);
      border: 2px dashed var(--quiz-border); border-radius: 14px; opacity: 0.75;
    }
    .preview-frame {
      width: 100%; height: 680px; border: 1px solid var(--quiz-border);
      border-radius: 14px; background: var(--quiz-bg, #0b1020);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <img src="quiz_icon.svg" alt="" width="30" height="30" />
        <span>QuizMaster <span class="brand-sub">2nde</span></span>
      </a>
      <button class="theme-toggle" type="button" data-theme-toggle>
        <span class="theme-toggle-icon" aria-hidden="true">☀️</span>
        <span class="theme-toggle-label">Thème clair</span>
      </button>
    </div>
  </header>

  <div class="qm-container anim-border-fade">
    <h1>
      QuizMaster Dynamique <span class="couleur-qui-change">:</span>
      <span class="clignotant">Générateur & Importateur</span>
    </h1>

    <div class="prompt-container">
      <p class="prompt-label">Prompt pour l'IA (génère le format complet avec catégories) :</p>
      <textarea class="prompt-box" id="prompt-text" readonly spellcheck="false"></textarea>
      <button class="btn-prompt-copy" id="copy-btn" type="button">Copier le prompt</button>
    </div>

    <div class="qm-grid">
      <div>
        <label style="display:block;margin-bottom:5px;font-weight:700;color:var(--quiz-text)">Charger un fichier :</label>
        <div class="file-upload-wrapper">
          <div class="btn-file-custom"><span>Sélectionner un JSON</span></div>
          <input type="file" id="file-input" accept=".json" />
        </div>
      </div>
      <div>
        <label style="display:block;margin-bottom:5px;font-weight:700;color:var(--quiz-text)">Coller du JSON :</label>
        <div style="display:flex;gap:5px">
          <textarea id="json-paste" placeholder="Collez le code ici..." style="height:42px;flex-grow:1"></textarea>
          <button class="btn-load" id="load-paste" type="button" style="height:42px;width:auto">Charger</button>
          <button id="export-btn" class="btn-load export-button" type="button" style="height:42px;width:auto;display:none">Exporter</button>
        </div>
      </div>
    </div>

    <div id="export-modal" class="export-overlay hidden">
      <div class="export-modal">
        <h2>Exporter le quiz</h2>
        <label for="export-title">Titre du quiz</label>
        <input id="export-title" type="text" placeholder="Entrez un titre pour l'export" />
        <div class="modal-actions">
          <button class="btn-load" id="export-confirm" type="button" style="width:auto">Exporter</button>
          <button class="btn-load export-button" id="export-cancel" type="button" style="width:auto">Annuler</button>
        </div>
      </div>
    </div>

    <label class="preview-label">Aperçu (moteur réel de quiz.html) :</label>
    <div id="preview-placeholder" class="preview-placeholder">
      Importez un JSON pour voir l'aperçu avec le moteur du site.
    </div>
    <iframe id="preview-frame" class="preview-frame hidden" title="Aperçu du quiz"></iframe>
  </div>

  <script>
    var loadedQuiz = null;

    function byId(id) { return document.getElementById(id); }

    var GENERATION_PROMPT = [
      "Tu es professeur et generateur de questionnaires scolaires pour une application",
      "web. Produis LE FICHIER JSON COMPLET d'un questionnaire, pret a etre enregistre.",
      "Reponds UNIQUEMENT avec le JSON : aucun texte, aucune balise markdown.",
      "",
      "=== COMMENT LE MOTEUR LIT CE FICHIER (a respecter a la lettre) ===",
      "Le fichier decrit un questionnaire divise en categories. Chaque question est",
      "soit un QCM (\"mcq\"), soit une reponse libre (\"text\"). Le moteur interprete :",
      "- \"type\": \"mcq\"  -> boutons ; \"options\" = liste des choix ;",
      "                    \"correct\" = INDEX de la bonne reponse (0 = 1er choix).",
      "- \"type\": \"text\" -> champ de saisie ; \"accepted\" = TOUTES les reponses acceptees",
      "                    (majuscules, espaces et virgules sont ignores).",
      "- \"solution\"     -> explication affichee a l'eleve apres sa reponse.",
      "- \"image\"        -> (facultatif) URL ou base64 affichee au-dessus des reponses.",
      "",
      "=== STRUCTURE EXACTE (memes cles, memes niveaux) ===",
      "{",
      "  \"subject\": \"[MATIERE]\",",
      "  \"title\": \"[TITRE DU QUESTIONNAIRE]\",",
      "  \"description\": \"[COURTE DESCRIPTION]\",",
      "  \"css\": \"[CSS PERSONNALISE FACULTATIF, ex : .important{color:#f59e0b;font-weight:900;}]\",",
      "  \"categories\": [",
      "    {",
      "      \"category\": \"1. [NOM DE LA CATEGORIE]\",",
      "      \"questions\": [",
      "        {",
      "          \"text\": \"Question a choix multiple ?\",",
      "          \"type\": \"mcq\",",
      "          \"image\": \"[FACULTATIF : URL, chemin, ou data:image/png;base64,...]\",",
      "          \"options\": [\"Choix A\", \"Choix B\", \"Choix C\"],",
      "          \"correct\": 0,",
      "          \"solution\": \"Explication claire de la bonne reponse.\"",
      "        },",
      "        {",
      "          \"text\": \"Question a reponse libre ? (tu peux aussi mettre <img src='...'> dans le texte)\",",
      "          \"type\": \"text\",",
      "          \"accepted\": [\"reponse attendue\", \"variante acceptee\"],",
      "          \"solution\": \"Explication detaillee.\"",
      "        }",
      "      ]",
      "    }",
      "  ]",
      "}",
      "",
      "=== PARAMETRES DE CE QUESTIONNAIRE ===",
      "- Matiere : [MATIERE]                 (ex : Italien)",
      "- Niveau : [NIVEAU]                   (ex : Seconde)",
      "- Theme : [SUJET DETAILLE]",
      "- Nombre de categories : [N]          (ex : 5)",
      "- Questions par categorie : entre [X] et [Y]",
      "- Total minimum : [TOTAL]",
      "- Langue des intitules et explications : [LANGUE]",
      "",
      "=== REGLES STRICTES ===",
      "1. Reponds UNIQUEMENT par le fichier JSON (pas de texte, pas de balises).",
      "2. Utilise EXACTEMENT ces cles : subject, title, description, css (facultatif),",
      "   categories, category, questions, text, type, image (facultatif), options,",
      "   correct, accepted, solution.",
      "3. \"correct\" est un NOMBRE (index) pour \"mcq\" : n'y mets jamais du texte.",
      "4. \"accepted\" est une LISTE de chaines pour \"text\".",
      "5. Dans les chaines : guillemets simples (') pour le HTML, guillemets francais",
      "   « » pour citer. Jamais de guillemets doubles non echappes.",
      "6. Aucun retour a la ligne reel dans une chaine : utilise <br> ou <p>.",
      "7. Aucun LaTeX. Puissances : x<sup>2</sup>. Multiplication : ×.",
      "8. Tu peux utiliser du HTML/des classes dans \"text\" et definir les styles dans",
      "   \"css\" (ex : <span class='important'>mot</span>). Classes fournies :",
      "   couleur-qui-change, clignotant, anim-border-fade.",
      "9. IMAGES : tu peux ajouter une image a une question avec le champ \"image\"",
      "   (URL, chemin, ou data-URI base64 : \"data:image/png;base64,....\") OU une balise",
      "   <img src='...'> dans le \"text\". Si j'ai fourni le base64, recopie-le tel quel.",
      "10. Varie les questions (vocabulaire, comprehension, application, production) et",
      "    les distracteurs. Accorde correctement genre et nombre.",
      "11. Verifie que le JSON est valide (virgules, accolades, crochets) avant de repondre.",
      "",
      "THEME A TRAITER : [SUJET DETAILLE]"
    ].join("\n");

    function copyPrompt() {
      var btn = byId("copy-btn");
      navigator.clipboard.writeText(GENERATION_PROMPT).then(function () {
        btn.textContent = "Copié !";
        btn.classList.add("success");
        setTimeout(function () { btn.textContent = "Copier le prompt"; btn.classList.remove("success"); }, 2000);
      });
    }

    function updateExportButtonVisibility() {
      var exportBtn = byId("export-btn");
      if (exportBtn) exportBtn.style.display = loadedQuiz ? "inline-flex" : "none";
    }

    /* ---------------------------------------------------------
       Chargement des vrais fichiers du site (moteur + styles).
       => QuizMaster se met a jour automatiquement quand quiz.html,
          quiz.js ou quiz.css changent.
       --------------------------------------------------------- */
    function fetchText(url) {
      return fetch(url, { cache: "no-store" }).then(function (res) {
        if (!res.ok) throw new Error("Impossible de charger " + url);
        return res.text();
      });
    }

    function loadAssets() {
      return Promise.all([
        fetchText("quiz.html"),
        fetchText("css/theme.css"),
        fetchText("css/quiz.css"),
        fetchText("js/quiz.js")
      ]).then(function (a) {
        return { quizHtml: a[0], themeCss: a[1], quizCss: a[2], quizJs: a[3] };
      });
    }

    function extractQuizContainer(quizHtml) {
      var doc = new DOMParser().parseFromString(quizHtml, "text/html");
      var el = doc.querySelector(".quiz-container");
      return el ? el.outerHTML : "";
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    function buildStandalone(data, title, assets) {
      var payloadData = {};
      for (var k in data) { if (Object.prototype.hasOwnProperty.call(data, k)) payloadData[k] = data[k]; }
      payloadData.title = title;
      var payload = JSON.stringify(payloadData).replace(/<\//g, "<\\/");
      var container = extractQuizContainer(assets.quizHtml);

      return "<!doctype html>\n<html lang=\"fr\" data-theme=\"dark\">\n<head>\n" +
        "<meta charset=\"UTF-8\" />\n" +
        "<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\" />\n" +
        "<meta name=\"theme-color\" content=\"#0b1020\" />\n" +
        "<title>" + escapeHtml(title) + "</title>\n" +
        "<style>\n" + assets.themeCss + "\n</style>\n" +
        "<style>\n" + assets.quizCss + "\n</style>\n" +
        "<style>.quiz-nav-bar{display:none}.results-actions #back-btn-results{display:none}</style>\n" +
        "</head>\n<body>\n" +
        container + "\n" +
        "<script>window.__EMBED_QUIZ__=" + payload + ";<\/script>\n" +
        "<script>\n" + assets.quizJs + "\n<\/script>\n" +
        "</body>\n</html>";
    }

    function mountPreview(data) {
      var frame = byId("preview-frame");
      var title = (data && data.title) ? data.title : "Aperçu";
      loadAssets().then(function (assets) {
        frame.srcdoc = buildStandalone(data, title, assets);
        byId("preview-placeholder").classList.add("hidden");
        frame.classList.remove("hidden");
      }).catch(function (err) {
        alert("Impossible de charger le moteur du quiz : " + err.message);
      });
    }

    function applyNewQuestions(data) {
      var parsed;
      try {
        parsed = typeof data === "string" ? JSON.parse(data) : data;
        if (!parsed || typeof parsed !== "object") throw new Error();
        if (!parsed.categories && !parsed.questions && !Array.isArray(parsed)) throw new Error();
      } catch (e) {
        alert("Erreur : le format JSON n'est pas valide.");
        return;
      }
      loadedQuiz = parsed;
      updateExportButtonVisibility();
      mountPreview(parsed);
    }

    function handleFileSelect(event) {
      var file = event.target.files[0];
      if (!file) return;
      var reader = new FileReader();
      reader.onload = function (e) { applyNewQuestions(e.target.result); };
      reader.readAsText(file);
    }

    function loadPastedJson() {
      var text = byId("json-paste").value;
      if (text.trim()) applyNewQuestions(text);
    }

    function openExportModal() {
      if (!loadedQuiz) { alert("Chargez d'abord un questionnaire JSON avant d'exporter."); return; }
      byId("export-title").value = (loadedQuiz && loadedQuiz.title) || "";
      byId("export-modal").classList.remove("hidden");
      byId("export-title").focus();
    }

    function closeExportModal() { byId("export-modal").classList.add("hidden"); }

    function confirmExport() {
      var title = byId("export-title").value.trim();
      if (!title) { alert("Entrez un titre pour le quiz."); return; }
      var btn = byId("export-confirm");
      btn.disabled = true;
      btn.textContent = "Préparation...";
      loadAssets().then(function (assets) {
        var doc = buildStandalone(loadedQuiz, title, assets);
        downloadFile(sanitizeFileName(title) + ".html", doc);
      }).catch(function (err) {
        alert("Erreur lors de l'export : " + err.message);
      }).then(function () {
        btn.disabled = false;
        btn.textContent = "Exporter";
        closeExportModal();
      });
    }

    function sanitizeFileName(name) {
      return (name.replace(/[<>:"/\\|?*\x00-\x1F]/g, "").trim().replace(/\s+/g, "_") || "quiz");
    }

    function downloadFile(filename, content) {
      var blob = new Blob([content], { type: "text/html;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var link = document.createElement("a");
      link.href = url; link.download = filename;
      document.body.appendChild(link); link.click();
      document.body.removeChild(link); URL.revokeObjectURL(url);
    }

    byId("prompt-text").value = GENERATION_PROMPT;
    byId("copy-btn").onclick = copyPrompt;
    byId("load-paste").onclick = loadPastedJson;
    byId("export-btn").onclick = openExportModal;
    byId("export-confirm").onclick = confirmExport;
    byId("export-cancel").onclick = closeExportModal;
    byId("file-input").addEventListener("change", handleFileSelect);
  </script>
  <script src="js/theme.js"></script>
</body>
</html>
